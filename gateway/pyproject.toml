[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vllm-scale-to-zero-gateway"
version = "0.1.0"
description = "A thin, private inference gateway for a vLLM model server that scales to zero: auth, warming-as-a-state, and content-free metering."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7", "respx>=0.21"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "BLE"]
ignore = [
    "E501",
    "B008",    # function-call-in-default-argument -- FastAPI Depends() pattern
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
