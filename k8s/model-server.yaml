apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-server
  namespace: inference
  labels:
    app.kubernetes.io/name: model-server
spec:
  # One replica. Each replica holds a full copy of the weights in VRAM, so
  # scaling out means another whole GPU node -- horizontal scaling here is a
  # cost decision, not a reflex. vLLM's continuous batching already keeps a
  # single GPU busy across many concurrent requests, which is the cheaper axis
  # to exploit first.
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate. A rolling update would try to schedule a
    # second GPU pod before terminating the first; on a one-GPU-per-replica
    # deployment that doubles GPU spend for the duration of every rollout, and
    # can fail outright if quota allows only one node. Recreate accepts a
    # short gap instead -- acceptable because the gateway already surfaces
    # warming as a first-class state.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: model-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-server
    spec:
      serviceAccountName: model-server
      # Land on the GPU pool. BOTH of these are required:
      #   - nodeSelector picks the accelerator pool.
      #   - tolerations get past the inference.io/accelerator taint that stops
      #     ordinary workloads from landing on expensive GPU nodes.
      # Omitting the toleration leaves the pod Pending forever with a
      # taint-mismatch event; omitting the selector lets it land on the cheap
      # CPU pool where there is no GPU and vLLM fails at startup.
      nodeSelector:
        inference.io/pool: gpu-inference
      tolerations:
        - key: inference.io/accelerator
          operator: Equal
          value: "true"
          effect: NoSchedule
      # Give the scheduler room to trigger a scale-up from zero rather than
      # failing fast when no GPU node exists yet.
      terminationGracePeriodSeconds: 60
      containers:
        - name: vllm
          image: ghcr.io/example/model-server:v0.2.0
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MAX_MODEL_LEN
              # Conservative single-L40S per-invocation limit (49,152 = 48 Ki).
              # An L40S is marketed at 48 GB, listed at ~44 GiB in AWS G6e specs,
              # and reports ~44.99 GiB physical device memory (~42.74 GiB at
              # 0.95 utilization). After ~35.0 GiB FP8 weights, ~2.27 GiB
              # workspace, and ~0.96 GiB DeltaNet recurrent state (16 slots),
              # ~4.51 GiB remains for paged KV (~66,544 modeled tokens under our
              # provisional hybrid-page calibration).
              #
              # 49,152 fits inside that ~66.5K modeled ceiling and covers ~3x
              # our peak single-invocation resident context (~15.8K tokens on
              # R11), whereas the 98,304 cumulative-run heuristic and Qwen's
              # 131,072 complex-task recommendation exceed a single L40S under
              # these assumptions. Reconcile with preserved vLLM startup logs
              # before raising. See docs/kv-cache-sizing.md and
              # scripts/size_kv_cache.py.
              value: "49152"
            - name: GPU_MEMORY_UTILIZATION
              # Leaves ~2.25 GiB headroom on a 44.99 GiB physical L40S so a
              # burst of long tool-calling prompts does not OOM the worker.
              value: "0.95"
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "expandable_segments:True"
            - name: TOOL_CALL_PARSER
              value: "qwen3_coder"
            - name: EXTRA_VLLM_ARGS
              # Qwen3.6-35B-A3B ships with a multimodal
              # (Qwen3_5MoeForConditionalGeneration) vision tower;
              # --language-model-only skips the vision encoder and its 16k-token
              # profiling cache (~8 GiB VRAM) for text serving. Because 30 of
              # the model's 40 layers are Gated DeltaNet, vLLM pre-allocates
              # recurrent state blocks per concurrent sequence (--max-num-seqs);
              # capping --max-num-seqs 16 keeps recurrent state to ~0.96 GiB so
              # the remaining pool goes to paged KV blocks.
              value: "--language-model-only --max-num-seqs 16 --max-num-batched-tokens 2048 --enforce-eager"
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              nvidia.com/gpu: "1"
              cpu: "4"
              memory: 48Gi
          # Loading a ~35 GiB FP8 MoE checkpoint into VRAM takes several
          # minutes. A startupProbe (rather than a long initialDelaySeconds on
          # readiness) lets the liveness probe stay aggressive once running
          # while still tolerating a slow boot: 90 * 10s = up to 15 minutes.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false # vLLM's official image runs as root; harden if your base image allows it
            capabilities:
              drop: ["ALL"]
      volumes: []
---
apiVersion: v1
kind: Service
metadata:
  name: model-server
  namespace: inference
spec:
  # ClusterIP, not LoadBalancer. The model server is never directly reachable
  # from outside the cluster -- only the gateway talks to it.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: model-server
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-server
  namespace: inference
  annotations:
    # IRSA (or equivalent workload-identity) role. Grants object-storage read
    # only if/when the model server needs to pull checkpoints at runtime
    # instead of (or in addition to) the baked-in weights.
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/inference-model-server
