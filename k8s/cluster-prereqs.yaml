apiVersion: v1
kind: Namespace
metadata:
  name: inference
---
# ── NVIDIA device plugin ─────────────────────────────────────────────────────
# Without this, nodes in the GPU pool join the cluster and never advertise
# the `nvidia.com/gpu` resource, so any pod requesting a GPU stays Pending
# forever. The failure presents as a scheduling problem with no obvious
# cause, which is why it is called out here rather than assumed.
#
# A GPU-enabled AMI (e.g. EKS's AL2023_x86_64_NVIDIA) already ships the driver
# and container runtime; this plugin only advertises the resource to the
# kubelet.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
    spec:
      # Must tolerate the accelerator taint, or the plugin cannot run on the
      # very nodes it exists to describe.
      tolerations:
        - key: inference.io/accelerator
          operator: Equal
          value: "true"
          effect: NoSchedule
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      # Only schedule where there is actually a GPU.
      nodeSelector:
        inference.io/pool: gpu-inference
      priorityClassName: system-node-critical
      containers:
        - name: nvidia-device-plugin-ctr
          image: nvcr.io/nvidia/k8s-device-plugin:v0.17.0
          env:
            - name: FAIL_ON_INIT_ERROR
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
