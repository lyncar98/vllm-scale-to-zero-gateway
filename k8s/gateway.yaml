apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-gateway
  namespace: inference
  labels:
    app.kubernetes.io/name: inference-gateway
spec:
  # Two replicas on the cheap CPU pool. The gateway is the always-on front
  # door: it must stay up while the GPU pool is scaled to zero, so that a
  # request arriving cold gets a "warming" answer from a live service rather
  # than a connection refused.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: inference-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inference-gateway
    spec:
      # Explicitly the system (CPU) pool. No GPU toleration, so this can never
      # accidentally occupy an accelerator node.
      nodeSelector:
        inference.io/pool: system
      containers:
        - name: gateway
          image: ghcr.io/example/inference-gateway:v0.1.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GATEWAY_MODEL_SERVER_URL
              value: http://model-server:8000
            - name: GATEWAY_GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: inference-gateway
                  key: gateway_api_key
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # Liveness and Readiness Probes:
          #
          # Liveness checks process health via /healthz.
          #
          # READINESS CONFIGURATION & THE COLD-START TRAP:
          # The gateway exposes two health endpoints:
          #   - /healthz: reports gateway process health.
          #   - /readyz: probes upstream model server availability.
          #
          # IMPORTANT: Pointing the Kubernetes readinessProbe at /readyz creates
          # an architectural cold-start trap. When the GPU pool scales to zero,
          # /readyz returns 503 ("warming"). If Kubernetes uses that for pod readiness,
          # it marks the gateway pod NotReady and removes it from the Service's
          # active endpoints. Callers then receive generic connection timeouts or
          # 502/504 errors from the AWS NLB instead of reaching the gateway to receive
          # the structured "503 service_warming" response and Retry-After header!
          #
          # Rule: If an architecture relies on an always-available front door to
          # manage cold starts, that front door's availability must not depend on
          # the availability of the component it controls.
          #
          # Therefore, the gateway's Kubernetes readinessProbe targets /healthz so
          # the gateway remains routable to serve warming responses when inference
          # is offline. /readyz remains available for external monitoring and canary
          # probes that specifically need to test end-to-end model availability.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: inference-gateway
  namespace: inference
  annotations:
    # INTERNAL load balancer. This is the load-bearing annotation: the
    # gateway is private by default. Flipping this to internet-facing would
    # expose a GPU-backed endpoint directly, bypassing whatever auth, quota
    # and usage metering fronts it today. Treat edits to this annotation as a
    # security review.
    service.beta.kubernetes.io/aws-load-balancer-scheme: internal
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: inference-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Example secret shape. In a real cluster this is synced from a secrets
# manager (e.g. External Secrets Operator), not committed -- this file exists
# so `kubectl apply -k .` works out of the box for local experimentation.
apiVersion: v1
kind: Secret
metadata:
  name: inference-gateway
  namespace: inference
type: Opaque
stringData:
  gateway_api_key: "replace-me"
