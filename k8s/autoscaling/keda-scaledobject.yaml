# Illustrative example: autoscaling the model-server Deployment with KEDA.
#
# NOTE ON CURRENT LIMITATION (0 -> 1 vs 1 -> N):
# This ScaledObject demonstrates how KEDA coordinates with Karpenter to scale
# GPU replicas down to zero on idle and scale up from 1 to N under load.
#
# However, using vLLM's internal queue depth (`vllm:num_requests_waiting`) has a
# fundamental cold-start limitation: when replicas = 0, vLLM is offline and
# cannot report its own queue depth! Prometheus has no target to scrape, so this
# metric alone CANNOT activate the deployment from 0 to 1 on incoming HTTP traffic.
#
# To bridge this gap:
# 1. The cron trigger below maintains a warm floor (desiredReplicas: 1) during
#    predictable school hours (America/Santiago).
# 2. Arbitrary, request-driven activation outside those hours requires an
#    out-of-band demand signal (such as gateway-side Prometheus metrics or an
#    asynchronous request queue). See README.md for details.
#
# Once a pod scales off zero, Karpenter provisions a matching GPU node for the
# resulting Pending pod (see karpenter-nodepool.yaml).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: model-server
  namespace: inference
spec:
  scaleTargetRef:
    name: model-server
  # Replicas sit at 0 when idle. minReplicaCount: 0 enables scale-to-zero.
  # Combined with Karpenter node consolidation, an idle pool incurs no GPU cost.
  minReplicaCount: 0
  maxReplicaCount: 4
  # How long an idle (empty-queue) deployment waits before scaling to zero.
  # Set above your p95 gap between requests during business hours, or you will
  # incur a cold start on every short lull.
  cooldownPeriod: 300
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc:9090
        metricName: vllm_num_requests_waiting
        # vLLM's own queue-depth metric. Effective for scaling 1 -> N when
        # requests back up behind active batches, and scaling N -> 0 when empty.
        # (Inactive when replicas = 0).
        query: sum(vllm:num_requests_waiting{service="model-server"})
        threshold: "1"
    - type: cron
      metadata:
        # Scheduled warm floor during known-busy hours, matching a traffic
        # pattern that follows a predictable daily/weekly shape (e.g., a
        # school day in Chile: Monday-Friday 08:00 to 20:00).
        # Keeping one replica warm during these hours trades a modest fixed GPU
        # cost to eliminate cold starts when teachers are actively planning.
        timezone: America/Santiago
        start: "0 8 * * 1-5"
        end: "0 20 * * 1-5"
        desiredReplicas: "1"
